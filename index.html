<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Δασική Πλοήγηση</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f3;color:#202820}
header{background:#234d35;color:white;padding:14px;font-size:21px;font-weight:bold}
.controls{padding:12px;display:grid;gap:9px}
button,select,input{font-size:16px;padding:11px;border-radius:8px;border:1px solid #aaa;background:white}
button{background:#285b3b;color:white;border:0;font-weight:bold}
#map{height:48vh;min-height:300px}
#info{padding:12px;background:white;line-height:1.7}
.small{font-size:13px;color:#555}
</style>
</head>
<body>
<header>🌲 Δασική Πλοήγηση</header>
<div class="controls">
<label>1. Φόρτωσε τα σημεία σου (GeoJSON)
<input id="file" type="file" accept=".geojson,.json,application/geo+json,application/json">
</label>
<label>2. Επίλεξε σημείο
<select id="target"><option value="">Φόρτωσε πρώτα το αρχείο</option></select>
</label>
<button id="gps">📍 Εντοπισμός θέσης μου</button>
<button id="follow">▶ Συνεχής παρακολούθηση GPS</button>
<button id="stop">■ Διακοπή GPS</button>
<button id="route">↗ Άνοιγμα πλοήγησης Google Maps</button>
</div>
<div id="map"></div>
<div id="info">Φόρτωσε το GeoJSON και επίλεξε το σημείο προορισμού.</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([37.9,23.8],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:19,attribution:'© OpenStreetMap contributors'
}).addTo(map);

let features=[],targetMarker=null,userMarker=null,accuracyCircle=null;
let pos=null,watchId=null;

const $=id=>document.getElementById(id);
const info=$('info');

function coords(f){
 if(!f.geometry||f.geometry.type!=='Point') return null;
 const c=f.geometry.coordinates;
 return [c[1],c[0]];
}
function label(f,i){
 const p=f.properties||{};
 return p.name||p.NAME||p.Name||p.id||p.ID||p.code||p.CODE||p.ΚΩΔΙΚΟΣ||p.ΟΝΟΜΑΣΙΑ||('Σημείο '+(i+1));
}
function chosen(){
 const i=Number($('target').value);
 return Number.isInteger(i)?features[i]:null;
}
function distance(a,b){
 return map.distance(L.latLng(a),L.latLng(b));
}
function bearing(a,b){
 const r=Math.PI/180;
 const p1=a[0]*r,p2=b[0]*r,dl=(b[1]-a[1])*r;
 const y=Math.sin(dl)*Math.cos(p2);
 const x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
 return (Math.atan2(y,x)/r+360)%360;
}
function updateInfo(){
 const f=chosen(),t=f&&coords(f);
 if(!f||!t){info.textContent='Φόρτωσε σημεία και επίλεξε προορισμό.';return;}
 let html='<b>Προορισμός:</b> '+label(f,features.indexOf(f));
 if(pos){
  const d=distance(pos,t),b=bearing(pos,t);
  html+='<br><b>Απόσταση:</b> '+(d>=1000?(d/1000).toFixed(2)+' km':Math.round(d)+' m');
  html+='<br><b>Κατεύθυνση από Βορρά:</b> '+Math.round(b)+'°';
  html+='<br><b>Ακρίβεια GPS:</b> περίπου '+Math.round(pos.accuracy)+' m';
 }else html+='<br>Πάτησε «Εντοπισμός θέσης μου».';
 info.innerHTML=html;
}
function selectTarget(){
 const f=chosen(),t=f&&coords(f);
 if(!t)return;
 if(targetMarker)map.removeLayer(targetMarker);
 targetMarker=L.marker(t).addTo(map).bindPopup(label(f,features.indexOf(f))).openPopup();
 map.setView(t,17);
 updateInfo();
}
$('file').addEventListener('change',async e=>{
 const file=e.target.files[0];if(!file)return;
 try{
  const data=JSON.parse(await file.text());
  if(data.type==='FeatureCollection')features=data.features;
  else if(data.type==='Feature')features=[data];
  else throw new Error('Το αρχείο δεν είναι GeoJSON FeatureCollection.');
  features=features.filter(f=>coords(f));
  if(!features.length)throw new Error('Δεν βρέθηκαν σημειακά γεωμετρικά αντικείμενα.');
  const sel=$('target');sel.innerHTML='';
  features.forEach((f,i)=>{
   const o=document.createElement('option');
   o.value=i;o.textContent=label(f,i);sel.appendChild(o);
  });
  if(window.pointsLayer)map.removeLayer(window.pointsLayer);
  window.pointsLayer=L.geoJSON({type:'FeatureCollection',features},{
   pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:7,color:'#176b3a',fillOpacity:.9}),
   onEachFeature:(f,l)=>l.bindPopup(label(f,features.indexOf(f)))
  }).addTo(map);
  map.fitBounds(window.pointsLayer.getBounds(),{padding:[20,20]});
  selectTarget();
 }catch(err){alert('Σφάλμα αρχείου: '+err.message);}
});
$('target').addEventListener('change',selectTarget);

function locate(){
 if(!navigator.geolocation){alert('Το πρόγραμμα περιήγησης δεν υποστηρίζει GPS.');return;}
 navigator.geolocation.getCurrentPosition(
  p=>setPosition(p),
  e=>alert('Δεν βρέθηκε θέση GPS: '+e.message),
  {enableHighAccuracy:true,timeout:20000,maximumAge:0}
 );
}
function setPosition(p){
 pos=[p.coords.latitude,p.coords.longitude];
 pos.accuracy=p.coords.accuracy;
 if(userMarker)map.removeLayer(userMarker);
 if(accuracyCircle)map.removeLayer(accuracyCircle);
 userMarker=L.circleMarker(pos,{radius:9,color:'#075ee8',fillColor:'#075ee8',fillOpacity:1})
  .addTo(map).bindPopup('Η θέση σου');
 accuracyCircle=L.circle(pos,{radius:pos.accuracy,color:'#075ee8',fillOpacity:.08}).addTo(map);
 updateInfo();
}
$('gps').onclick=locate;
$('follow').onclick=()=>{
 if(!navigator.geolocation)return alert('Δεν υποστηρίζεται GPS.');
 if(watchId!==null)return;
 watchId=navigator.geolocation.watchPosition(setPosition,
  e=>info.textContent='Σφάλμα GPS: '+e.message,
  {enableHighAccuracy:true,maximumAge:2000,timeout:20000});
};
$('stop').onclick=()=>{
 if(watchId!==null)navigator.geolocation.clearWatch(watchId);
 watchId=null;
};
$('route').onclick=()=>{
 const f=chosen(),t=f&&coords(f);
 if(!t)return alert('Επίλεξε πρώτα σημείο.');
 const dest=t[0]+','+t[1];
 const origin=pos?pos[0]+','+pos[1]:'';
 window.open('https://www.google.com/maps/dir/?api=1'+
  (origin?'&origin='+encodeURIComponent(origin):'')+
  '&destination='+encodeURIComponent(dest)+'&travelmode=walking','_blank');
};
</script>
</body>
</html>
